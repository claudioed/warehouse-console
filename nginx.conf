server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side (React Router) routing: unknown paths fall back to
    # index.html so the app's own 404 route renders instead of nginx's.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
