# The console shell's static runtime.
#
# Serves the shell itself. The remotes are served by their OWN nginx pods and
# routed by the Nginx web gateway at /mfes/<context>/ -- this server never
# proxies to them, and it never proxies an API either. Kong owns every API on
# its own host port and must never handle HTML/JS/CSS.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration, mounted from a ConfigMap rather than baked into
    # the image -- this is what lets ONE image serve many environments. It is
    # fetched before the app mounts, so it must never be cached: a stale
    # apiOrigin would point the whole console at the wrong cluster.
    #
    # `=` (exact match) so it can never be shadowed by the SPA fallback, and an
    # explicit 404 rather than falling through to index.html: the loader checks
    # the content type precisely because an SPA fallback would otherwise return
    # HTML with a 200 and produce a confusing JSON parse error.
    location = /config.json {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Entry document: re-fetched every load so a redeploy is picked up
    # immediately rather than pinned to a deleted chunk set.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # NOTE: no `expires` directive here. `expires 1y` emits its OWN
    # Cache-Control: max-age=... header, which combined with the add_header
    # below sends TWO Cache-Control headers on every asset response. Setting
    # max-age inside the single add_header keeps the response unambiguous.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side (React Router) routing: unknown paths fall back to
    # index.html so the app's own 404 route renders instead of nginx's.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
