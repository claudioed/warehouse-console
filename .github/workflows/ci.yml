name: CI

# warehouse-console depends on @warehouse/ui-kit via `file:../warehouse-ui-kit`
# (no npm registry publish step yet, single local workspace). CI checks out
# both repos as SIBLING directories under $GITHUB_WORKSPACE so that relative
# path resolves the same way it does on a contributor's machine.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: warehouse-console
      - uses: actions/checkout@v7
        with:
          repository: claudioed/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
        working-directory: warehouse-console
      - run: npm run lint
        working-directory: warehouse-console

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: warehouse-console
      - uses: actions/checkout@v7
        with:
          repository: claudioed/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
        working-directory: warehouse-console
      - run: npm run typecheck
        working-directory: warehouse-console

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: warehouse-console
      - uses: actions/checkout@v7
        with:
          repository: claudioed/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
        working-directory: warehouse-console
      - run: npm run build
        working-directory: warehouse-console

  trivy-fs-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ============================================================
  # CLASSIFICATION: PACKAGING VALIDATION (Helm chart)
  # Runs ONLY for a pull_request targeting main -- validated pre-merge,
  # never on develop pushes/PRs or on push-to-main (already validated).
  # ============================================================
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true
      - uses: helm/chart-testing-action@v2.8.0
      - name: Run chart-testing (lint)
        run: ct lint --charts charts/warehouse-console --validate-maintainers=false --check-version-increment=false

  # Shift-left container scan: builds the image (no push) on every PR
  # targeting main, so a vulnerable base image or dependency is caught
  # before merge, not just at publish time. Blocks on CRITICAL/HIGH with a
  # known fix; findings also land in the repo's Security tab (SARIF)
  # regardless of pass/fail so history is visible even when nothing blocks.
  # ============================================================
  # CLASSIFICATION: SECURITY SCANNER (container image)
  # Runs ONLY for a pull_request targeting main -- validated pre-merge,
  # never on develop pushes/PRs or on push-to-main (already validated).
  # ============================================================
  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: warehouse-console
      - uses: actions/checkout@v7
        with:
          repository: claudioed/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: docker/setup-buildx-action@v4
      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: warehouse-console
          build-contexts: |
            uikit=warehouse-ui-kit
          platforms: linux/amd64
          push: false
          load: true
          tags: warehouse-console:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (SARIF, always uploaded)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: 'warehouse-console:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      - name: "Trivy scan (blocking gate: CRITICAL/HIGH with a fix available)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'warehouse-console:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================
  # CLASSIFICATION: PUBLISH (Docker image) -- push-to-main only
  # ============================================================
  docker-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write   # cosign keyless signing (Fulcio/Rekor via GitHub OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          path: warehouse-console
      - uses: actions/checkout@v7
        with:
          repository: claudioed/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: warehouse-console
          build-contexts: |
            uikit=warehouse-ui-kit
          platforms: linux/amd64
          push: true
          tags: |
            claudioed/warehouse-console:latest
            claudioed/warehouse-console:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the published image (keyless, GitHub OIDC identity)
        run: |
          cosign sign --yes \
            claudioed/warehouse-console@${{ steps.build.outputs.digest }}
      - name: Generate SBOM (SPDX) for the published image
        uses: anchore/sbom-action@v0
        with:
          image: claudioed/warehouse-console@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest the image with its SBOM (keyless)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            claudioed/warehouse-console@${{ steps.build.outputs.digest }}
      - name: Upload SBOM as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # Cuts a GitHub Release (+ matching git tag + versioned Docker tag) on every
  # merge to main. Runs only after docker-publish actually succeeded, so a
  # release always points at an image that is genuinely live on Docker Hub.
  # Versioning: simple auto-increment patch (vX.Y.Z -> vX.Y.(Z+1)), starting
  # at v0.1.0 if no tag exists yet. No commit-message parsing.
  # ============================================================
  # CLASSIFICATION: PUBLISH (GitHub release + Helm chart) -- push-to-main only
  # ============================================================
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        run: |
          git fetch origin --tags --force
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            new="v${major}.${minor}.${patch}"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag the already-published image with the release version
        run: |
          docker buildx imagetools create \
            -t claudioed/warehouse-console:${{ steps.version.outputs.version }} \
            claudioed/warehouse-console:${{ env.SHORT_SHA }}
      - name: Package and publish the Helm chart for this release
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          CHART_VERSION="${CHART_VERSION#v}"
          mkdir -p /tmp/chart-out
          helm package charts/warehouse-console \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            -d /tmp/chart-out
          echo "CHART_TGZ=/tmp/chart-out/warehouse-console-${CHART_VERSION}.tgz" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart-out/warehouse-console-${CHART_VERSION}.tgz" \
            oci://ghcr.io/claudioed
      - name: Create and push the git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ env.CHART_TGZ }}
          body: |
            Docker image: `claudioed/warehouse-console:${{ steps.version.outputs.version }}`
            (also tagged `latest` and `${{ env.SHORT_SHA }}`)

            Helm chart: `oci://ghcr.io/claudioed/warehouse-console:${{ steps.version.outputs.version }}`
            (also attached below as a `.tgz`)
